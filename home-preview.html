<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bride Journal | תצוגה מקדימה למסך הבית</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#FAF7F3;--rose-50:#F6EFEB;--rose-100:#E9D8D1;--rose-300:#CFA9A2;--rose-600:#B77F79;--rose-900:#91605B;--ink:#302B28;--muted:#81776F;--border:#E9E1D8;--green:#7F8E7A;--green-bg:#EFF2EB}
*{box-sizing:border-box}body{margin:0;background:#f7f4f1;font-family:Assistant,Arial,sans-serif;color:var(--ink)}
.preview-note{background:#302B28;color:#fff;text-align:center;padding:8px 10px;font-size:12px;font-weight:700}
#shell{width:min(480px,100%);margin:0 auto;height:calc(100dvh - 34px);background:#fff;position:relative;display:flex;flex-direction:column;box-shadow:0 0 22px #0001}
.topbar{height:51px;flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:#fff}
.topbar .brand{font-weight:800;color:var(--rose-900);letter-spacing:.5px;font-size:17px;text-align:center}.topbar small{display:block;font-size:10px;text-align:center;color:var(--rose-600)}
.topbar .icon{font-size:17px;color:var(--rose-900)}
#shell>main{flex:1;min-height:0;padding:8px 12px 70px;overflow:auto}
nav.bottom{height:59px;position:absolute;bottom:0;left:0;width:100%;display:flex;justify-content:space-around;align-items:center;background:#fff;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
nav.bottom span:first-child{color:var(--rose-900);font-weight:800}
button,input{font-family:inherit}
/* Home v2: no background artwork; visually aligned with existing Bride Journal palette. */
#shell:has(.bj-home-v2){height:100dvh;min-height:0;overflow:hidden}
#shell:has(.bj-home-v2)>main{min-height:0;overflow-y:auto;padding:8px 12px calc(65px + env(safe-area-inset-bottom));background:#fff}
.bj-home-v2{display:flex;flex-direction:column;gap:9px;padding:0;max-width:450px;margin:0 auto;color:var(--ink)}
.bj-home-v2 .bj-home-hero{background:var(--cream);border:1px solid var(--border);border-radius:14px;padding:11px 12px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.bj-home-v2 .bj-home-kicker{margin:0;font-size:11px;letter-spacing:.3px;font-weight:700;color:var(--rose-900)}
.bj-home-v2 .bj-name-input{font-size:24px;font-weight:800;border:0;border-bottom:1px solid var(--rose-100);border-radius:0;text-align:center;background:transparent;width:100%;max-width:305px;height:36px;padding:0 0 3px;margin:0;color:var(--ink)}
.bj-home-v2 .bj-home-date{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--muted)}
.bj-home-v2 .bj-home-date input{height:30px;width:150px;max-width:150px;padding:3px 7px;text-align:center;font-size:12px;background:#fff;border-radius:7px}
.bj-home-v2 .bj-home-days{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-top:3px}
.bj-home-v2 .bj-home-days strong{font-size:38px;font-weight:800;line-height:1;color:var(--rose-900)}
.bj-home-v2 .bj-home-days span{font-size:13px;color:var(--muted);font-weight:700}
.bj-home-v2 .bj-home-days-empty{margin:6px 0;font-size:13px;font-weight:700;color:var(--rose-900)}
.bj-home-v2 .bj-home-progress{background:#fff;border:1px solid var(--border);border-radius:13px;padding:11px 13px 9px}
.bj-home-v2 .bj-home-progress-top{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.bj-home-v2 .bj-home-progress-top strong{font-weight:800}
.bj-home-v2 .bj-home-progress-top span{font-size:18px;font-weight:800;color:var(--rose-900)}
.bj-home-v2 .bj-home-progress-track{height:8px;border-radius:20px;overflow:hidden;background:var(--rose-50);margin-top:7px}
.bj-home-v2 .bj-home-progress-track span{display:block;height:100%;border-radius:inherit;background:var(--green)}
.bj-home-v2 .bj-home-progress p{margin:4px 0 0;font-size:11px;color:var(--muted)}
.bj-home-v2 .bj-home-shortcuts h2{font-size:14px;font-weight:800;margin:0 0 6px;color:var(--ink)}
.bj-home-v2 .bj-home-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.bj-home-v2 .bj-home-tile{background:var(--rose-50);border:1px solid var(--border);border-radius:12px;min-height:80px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font:800 12px 'Assistant',sans-serif;color:var(--ink);cursor:pointer}
.bj-home-v2 .bj-home-tile:nth-child(2){background:#F8F3ED}.bj-home-v2 .bj-home-tile:nth-child(3){background:var(--green-bg)}.bj-home-v2 .bj-home-tile:nth-child(4){background:#F4F2EE}
.bj-home-v2 .bj-home-tile-icon{display:grid;place-items:center;color:var(--rose-900)}
.bj-home-v2 .bj-home-tile-icon svg{width:22px;height:22px}
.bj-home-v2 .bj-home-journey{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:right;padding:11px 15px;min-height:59px;background:var(--rose-900);color:#fff;border:0;border-radius:12px;font-family:inherit;cursor:pointer}
.bj-home-v2 .bj-home-journey>span:first-child{display:flex;flex-direction:column;gap:2px}
.bj-home-v2 .bj-home-journey strong{font-size:15px}.bj-home-v2 .bj-home-journey small{font-size:11px;color:#fffde9}
.bj-home-v2 .bj-home-journey>span:last-child{font-size:24px}
.bj-home-v2 .bj-home-events{width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;min-height:46px;border:1px solid var(--border);border-radius:11px;background:#fff;text-align:right;font-family:inherit;color:var(--ink);cursor:pointer}
.bj-home-v2 .bj-home-events>span:first-child{display:flex;flex-direction:column;gap:2px}
.bj-home-v2 .bj-home-events strong{font-size:12px}.bj-home-v2 .bj-home-events small{font-size:10.5px;color:var(--muted)}
.bj-home-v2 .bj-home-events>span:last-child{font-size:20px;color:var(--rose-900)}
.bj-home-v2 button:focus-visible{outline:2px solid var(--rose-600);outline-offset:2px}
@media(max-height:720px){.bj-home-v2{gap:6px}.bj-home-v2 .bj-home-hero{padding:7px 10px}.bj-home-v2 .bj-name-input{height:30px;font-size:21px}.bj-home-v2 .bj-home-days strong{font-size:32px}.bj-home-v2 .bj-home-progress{padding:7px 10px}.bj-home-v2 .bj-home-tile{min-height:64px;gap:4px}.bj-home-v2 .bj-home-journey{min-height:48px;padding:7px 13px}.bj-home-v2 .bj-home-events{min-height:39px;padding:6px 10px}}
@media(max-width:360px){.bj-home-v2 .bj-home-tiles{gap:4px}.bj-home-v2 .bj-home-tile{font-size:11px}}
/* On tiny screens or with accessibility text scaling, scroll instead of hiding important controls. */

</style></head><body>
<div class="preview-note">תצוגת בדיקה בלבד · נתוני הדגמה · ללא שמירת מידע</div>
<div id="shell"><header class="topbar"><span class="icon">?</span><div class="brand">BRIDE_JOURNAL<small>BY MATAT</small></div><span class="icon">♡</span></header>
<main><div class="bj-home bj-home-v2">
<section class="bj-home-hero" aria-label="פרטי החתונה"><p class="bj-home-kicker">החתונה שלנו</p>
<input class="bj-name-input" type="text" aria-label="שמות בני הזוג" value="נועה & דניאל" placeholder="השמות שלכם">
<div class="bj-home-date"><span>תאריך החתונה</span><input id="date" type="date" aria-label="תאריך החתונה" value="2027-05-28"></div>
<div class="bj-home-days"><strong id="days">184</strong><span>ימים עד החתונה</span></div></section>
<section class="bj-home-progress" aria-label="התקדמות בתכנון"><div class="bj-home-progress-top"><strong>ההתקדמות שלכם</strong><span>32%</span></div><div class="bj-home-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="32"><span style="width:32%"></span></div><p>34 מתוך 106 משימות הושלמו</p></section>
<section class="bj-home-shortcuts" aria-label="כלי תכנון"><h2>הכלים שלכם</h2><div class="bj-home-tiles">
<button class="bj-home-tile" type="button"><span class="bj-home-tile-icon">☑</span><span>משימות</span></button>
<button class="bj-home-tile" type="button"><span class="bj-home-tile-icon">▤</span><span>תקציב</span></button>
<button class="bj-home-tile" type="button"><span class="bj-home-tile-icon">♙</span><span>מוזמנים</span></button>
<button class="bj-home-tile" type="button"><span class="bj-home-tile-icon">◈</span><span>אלכוהול</span></button>
</div></section>
<button class="bj-home-journey" type="button"><span><strong>לשלבי התכנון</strong><small>השלב הנוכחי: תיאום ספקים</small></span><span aria-hidden="true">‹</span></button>
<button class="bj-home-events" type="button"><span><strong>אירועים נלווים</strong><small>הפרשת חלה · מקווה · מסיבת רווקות</small></span><span aria-hidden="true">‹</span></button>
</div></main><nav class="bottom"><span>בית</span><span>משימות</span><span>תקציב</span><span>מוזמנים</span><span>עוד</span></nav>
</div>
<script>const input=document.querySelector("#date"),d=document.querySelector("#days");function refresh(){const n=new Date(input.value+"T12:00:00"),today=new Date();today.setHours(12,0,0,0);d.textContent=Math.max(0,Math.ceil((n-today)/86400000));}input.addEventListener("change",refresh);refresh();</script>
</body></html>
