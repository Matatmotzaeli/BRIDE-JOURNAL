<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>Bride Journal · מסך הבית — הצעת עיצוב חדשה</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#fff;--cream:#FAF7F3;--rose:#91605B;--soft:#F6EFEB;--border:#E9E1D8;--ink:#302B28;--muted:#81776F;--green:#7F8E7A}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f6f3ef;color:var(--ink);font-family:'Assistant',Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}
.preview-ribbon{text-align:center;background:#302B28;color:white;padding:5px 10px;font-size:11px;font-weight:700}
.shell{height:calc(100dvh - 26px);max-width:480px;margin:0 auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 8px 40px #1e1a1512;overflow:hidden}
header{flex:none;min-height:52px;padding:7px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.logo{font-size:17px;letter-spacing:.25px;font-weight:800;color:var(--rose);text-align:center;line-height:1.1}.logo small{display:block;font-weight:700;font-size:10px;letter-spacing:1.4px}
.header-action{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--border);border-radius:50%;background:white;color:var(--rose);font-size:16px}
main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(13px,2vh,19px);padding:15px 18px 16px;overflow:auto}
.hello{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.hello h1{font-size:23px;margin:0;font-weight:800;line-height:1.2}.hello span{color:var(--muted);font-size:12px}
.hero{border-radius:17px;background:var(--cream);border:1px solid #e8e0d8;padding:20px 17px 16px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.eyebrow{color:var(--rose);letter-spacing:.3px;font-size:11px;font-weight:700}
.names{display:block;font-size:25px;font-weight:800;line-height:1.2;color:var(--ink);width:100%;max-width:200px;background:transparent;border:0;border-bottom:1px solid transparent;padding:4px 0}
.names:focus{outline:0;border-bottom-color:var(--rose)}
.date-line{display:flex;align-items:center;gap:5px;margin-top:8px;color:var(--muted);font-size:12px}
.date-line input{width:125px;min-width:0;border:0;background:transparent;color:var(--rose);font-size:12px;padding:1px}
.counter{border-right:1px solid #ddcec3;padding-right:14px;text-align:center;min-width:95px}
.counter strong{display:block;color:var(--rose);font-weight:800;line-height:1;font-size:49px;font-variant-numeric:tabular-nums}
.counter span{font-size:11px;font-weight:700;color:var(--muted)}
.progress{border-top:1px solid #e9dfd8;margin-top:17px;padding-top:13px}
.progress-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;font-weight:700}
.progress-head strong{color:var(--rose);font-size:15px}
.progress-track{height:7px;border-radius:20px;background:#e9dfd8;overflow:hidden}
.progress-track i{display:block;width:32%;height:100%;background:var(--green);border-radius:20px}
.tools-head{display:flex;align-items:baseline;justify-content:space-between}
.tools-head h2{font-size:19px;line-height:1.2;margin:0;font-weight:800}
.tools-head span{font-size:12px;color:var(--muted)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:10px}
.tool{border:1px solid var(--border);border-radius:13px;min-height:92px;background:#fff;display:flex;align-items:center;justify-content:flex-start;gap:13px;text-align:right;padding:14px 13px;color:var(--ink);font-size:15px;font-weight:800}
.tool:nth-child(2){background:#fbf8f5}.tool:nth-child(3){background:#f7f7f2}.tool:nth-child(4){background:#faf8f6}
.tool .glyph{display:grid;place-items:center;flex:none;width:37px;height:37px;border-radius:11px;background:#f1e6e0;color:var(--rose)}
.tool:nth-child(3) .glyph{background:#e8ece6;color:#6c8065}
.glyph svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.more{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:right;padding:12px 15px;border:1px solid var(--border);background:white;border-radius:12px;color:var(--ink)}
.more span{font-size:14px;font-weight:800}.more small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.more b{font-size:21px;color:var(--rose);font-weight:400}
nav{height:59px;flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border);background:#fff}
nav button{border:0;background:transparent;color:var(--muted);font-size:11px;display:grid;place-items:center;align-content:center;gap:2px;padding:3px 0}
nav .active{color:var(--rose);font-weight:800}
nav svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.toast{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);background:#302b28;color:white;padding:8px 14px;border-radius:40px;font-size:12px;display:none;white-space:nowrap}
@media(max-height:760px){main{gap:10px;padding:9px 16px 10px}.hello h1{font-size:21px}.hero{padding:14px 15px 12px}.counter strong{font-size:43px}.progress{margin-top:12px;padding-top:10px}.tools{gap:8px;margin-top:7px}.tool{min-height:76px;padding:9px;font-size:14px;gap:9px}.tool .glyph{width:33px;height:33px}.more{padding:8px 12px}header{min-height:48px}nav{height:55px}}
@media(max-height:630px){main{justify-content:flex-start}.tool{min-height:66px}.hero{padding:10px 13px}.hello h1{font-size:19px}.names{font-size:21px}.counter strong{font-size:37px}}
@media(max-width:355px){main{padding-inline:11px}.tool{font-size:13px;gap:7px}.tool .glyph{width:30px;height:30px}.hero-grid{gap:3px}.counter{min-width:84px;padding-right:9px}.names{font-size:21px}}
</style></head>
<body><div class="preview-ribbon">הדמיה לבדיקה · ללא חיבור למידע אישי</div>
<div class="shell">
<header><button class="header-action" aria-label="עזרה">?</button><div class="logo">BRIDE_JOURNAL<small>BY MATAT</small></div><button class="header-action" aria-label="הגדרות">⚙</button></header>
<main>
<div class="hello"><h1>היומן שלנו ♡</h1><span>כל מה שצריך, במקום אחד</span></div>
<section class="hero" aria-label="החתונה וההתקדמות">
 <div class="hero-grid"><div><div class="eyebrow">היום המיוחד שלנו</div><input class="names" aria-label="שמות בני הזוג" value="נועה & דניאל"/><div class="date-line"><span>תאריך החתונה</span><input id="date" type="date" value="2027-05-28"/></div></div><div class="counter"><strong id="days">184</strong><span>ימים לחתונה</span></div></div>
 <div class="progress"><div class="progress-head"><span>התקדמות בתכנון · 34 מתוך 106 משימות</span><strong>32%</strong></div><div class="progress-track"><i></i></div></div>
</section>
<section aria-label="כלים"><div class="tools-head"><h2>מה נעשה היום?</h2><span>הכלים שלכם</span></div>
 <div class="tools">
  <button class="tool" data-label="רשימת משימות"><span class="glyph"><svg viewBox="0 0 24 24"><path d="m4 7 2 2 4-4M13 7h7M4 17l2 2 4-4M13 17h7"/></svg></span>משימות</button>
  <button class="tool" data-label="ניהול תקציב"><span class="glyph"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18M7 15h5"/></svg></span>תקציב</button>
  <button class="tool" data-label="רשימת מוזמנים"><span class="glyph"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 8a3 3 0 0 1 0 6M18 15c2 0 3 2 3 4"/></svg></span>מוזמנים</button>
  <button class="tool" data-label="מחשבון אלכוהול"><span class="glyph"><svg viewBox="0 0 24 24"><path d="M4 4h16L12 13 4 4ZM12 13v7M8 20h8"/></svg></span>אלכוהול</button>
 </div>
</section>
<button class="more" data-label="אירועים נלווים"><span><span>אירועים נלווים</span><small>הפרשת חלה · מקווה · מסיבת רווקות</small></span><b>‹</b></button>
</main>
<nav aria-label="ניווט"><button class="active" data-label="בית"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9H3v-9Z"/></svg>בית</button><button data-label="משימות"><svg viewBox="0 0 24 24"><path d="m5 8 2 2 3-4M13 8h7M5 17l2 2 3-4M13 17h7"/></svg>משימות</button><button data-label="תקציב"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M4 10h16"/></svg>תקציב</button><button data-label="מוזמנים"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg>מוזמנים</button><button data-label="עוד"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>עוד</button></nav>
</div><div class="toast" role="status"></div>
<script>
const days=document.querySelector("#days");document.querySelector("#date").addEventListener("change",e=>{const d=new Date(e.target.value+"T12:00:00"),now=new Date();now.setHours(12,0,0,0);days.textContent=Math.max(0,Math.ceil((d-now)/86400000))});document.querySelector("#date").dispatchEvent(new Event("change"));
document.querySelectorAll("[data-label]").forEach(b=>b.addEventListener("click",()=>{const t=document.querySelector(".toast");t.textContent="תצוגה בלבד: "+b.dataset.label;t.style.display="block";setTimeout(()=>t.style.display="none",1800)}));
</script></body></html>
